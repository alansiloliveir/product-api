spring.application.name=product-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
spring.datasource.username=${DB_USER:product_user}
spring.datasource.password=${DB_PASSWORD:product_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false